name: Supabase Keep-Alive

on:
  schedule:
    # Runs twice daily at 00:00 and 12:00 UTC to prevent Supabase 7-day inactivity pause
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows running manually from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY secret is not configured in repository Secrets. Skipping."
            exit 0
          fi

          echo "Sending keep-alive heartbeat to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/")

          echo "Supabase heartbeat status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "✅ Supabase project pinged successfully! Active status preserved."
          else
            echo "⚠️ Non-200 status received: ${HTTP_STATUS}"
          fi
